<div class="profile-modal d-flex justify-content-center align-items-start mt-5">
  <div class="card border-0 shadow-lg rounded-4" style="width: 360px;">

    <!-- Header limpio -->
    <div class="card-header bg-white border-0 d-flex justify-content-between align-items-center pb-0">
      <h6 class="fw-semibold mb-0 text-secondary">Cuenta</h6>
      <button class="btn-close" (click)="closeProfile()"></button>
    </div>

    <!-- Body -->
    <div class="card-body text-center pt-2">

      <!-- Avatar estilo Google -->
      <div class="mb-3">
        <div class="rounded-circle bg-light d-flex justify-content-center align-items-center mx-auto"
             style="width:80px; height:80px;">
          <i class="bi bi-person-fill fs-3 text-secondary"></i>
        </div>
      </div>

      <h6 class="fw-semibold mb-1">
        {{ userData?.nombre || 'No disponible' }}
      </h6>
      <p class="text-muted small mb-3">
        {{ userData?.email || 'No disponible' }}
      </p>

      <hr class="my-3">

      <!-- Info -->
      <div class="text-start small">
        <div class="d-flex justify-content-between mb-2">
          <span class="text-muted">Rol</span>
          <span class="fw-medium">{{ userData?.role || 'No disponible' }}</span>
        </div>

        <div class="d-flex justify-content-between mb-2">
          <span class="text-muted">Usuario</span>
          <span class="fw-medium">{{ userData?.usuario || 'No disponible' }}</span>
        </div>
      </div>

      <!-- Botón cambiar contraseña -->
      <button class="btn btn-outline-primary w-100 mt-3 rounded-pill"
              (click)="openChangePassword()">
        Cambiar contraseña
      </button>

      <!-- Componente cambio contraseña -->
      <div *ngIf="showChangePassword" class="mt-3">
        <app-change-password (close)="closeChangePassword()"></app-change-password>
      </div>

    </div>

    <!-- Footer -->
    <div class="card-footer bg-white border-0 pt-0">
      <button class="btn btn-light w-100 text-danger fw-medium"
              (click)="logout()">
        Cerrar sesión
      </button>
    </div>

  </div>
</div>
