<section>
  <div class="row mt-5">

    <div
      class="col-md-6 mb-4"
      *ngFor="let group of groups"
      (click)="goToGroup(group.id)"
    >
      <div class="card p-4 h-100 cursor-pointer">
        <img
          src="assets/imgs/default.png"
          class="card-img-top"
          alt="..."
          style="width: auto; height: 230px;"
        />

        <div class="card-header">
          <h3>{{ group.name }}</h3>
        </div>

        <div class="card-body">
          <p>{{ group.description }}</p>
        </div>
      </div>
    </div>

  </div>
</section>
