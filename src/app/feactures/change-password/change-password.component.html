<div class="card p-4 shadow-sm">
  <h5>Cambiar Contraseña</h5>

  <!-- Alerta -->
  <div *ngIf="alertMessage" class="alert" [ngClass]="{
    'alert-success': alertType === 'success',
    'alert-danger': alertType === 'error'
  }">
    {{ alertMessage }}
  </div>

  <form [formGroup]="passwordForm" (ngSubmit)="onSubmit()">

    <!-- Nueva contraseña -->
    <div class="mb-3">
      <label class="form-label">Nueva Contraseña</label>
      <div class="input-group">
        <input 
          [type]="showNewPassword ? 'text' : 'password'"
          class="form-control" 
          formControlName="newPassword"
          [ngClass]="{
            'is-invalid': passwordForm.get('newPassword')?.invalid 
            && passwordForm.get('newPassword')?.touched
          }"
        >

        <button 
          type="button"
          class="btn btn-outline-secondary"
          (click)="toggleNewPassword()">
          <i class="bi" 
             [ngClass]="showNewPassword ? 'bi-eye-slash' : 'bi-eye'">
          </i>
        </button>
      </div>

      <div class="invalid-feedback d-block"
           *ngIf="
             passwordForm.get('newPassword')?.errors?.['minlength'] &&
             passwordForm.get('newPassword')?.touched
           ">
        La contraseña debe tener al menos 6 caracteres
      </div>
    </div>

    <!-- Confirmar contraseña -->
    <div class="mb-3">
      <label class="form-label">Confirmar Contraseña</label>
      <div class="input-group">
        <input 
          [type]="showConfirmPassword ? 'text' : 'password'"
          class="form-control" 
          formControlName="confirmPassword"
          [ngClass]="{
            'is-invalid': 
              (passwordForm.get('confirmPassword')?.invalid 
              && passwordForm.get('confirmPassword')?.touched)
              || (passwordForm.errors?.['mismatch'] 
              && passwordForm.get('confirmPassword')?.touched)
          }"
        >

        <button 
          type="button"
          class="btn btn-outline-secondary"
          (click)="toggleConfirmPassword()">
          <i class="bi" 
             [ngClass]="showConfirmPassword ? 'bi-eye-slash' : 'bi-eye'">
          </i>
        </button>
      </div>

      <div class="invalid-feedback d-block"
           *ngIf="
             passwordForm.get('confirmPassword')?.invalid &&
             passwordForm.get('confirmPassword')?.touched
           ">
        Confirma tu contraseña
      </div>

      <div class="invalid-feedback d-block"
           *ngIf="
             passwordForm.errors?.['mismatch'] &&
             passwordForm.get('confirmPassword')?.touched
           ">
        Las contraseñas no coinciden
      </div>
    </div>

    <!-- Botón -->
    <button 
      type="submit" 
      class="btn btn-primary w-100"
      [disabled]="passwordForm.invalid"
    >
      Cambiar Contraseña
    </button>

  </form>
</div>
