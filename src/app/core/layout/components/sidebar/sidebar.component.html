<section>
  <div class="row">
    <div class="col-12 col-md-6 col-lg-12 mb-4">
      <div class="p-4 rounded-3 bg-light shadow-sm">
        <h4 class="mb-4">Menu</h4>
        <ul class="nav flex-column">
          <li class="nav-item mb-2" *ngFor="let link of links">
            <a class="nav-link text-dark" (click)="navigate(link.route)">
              {{ link.label }}
            </a>
          </li>
        </ul>
      </div>
    </div>
  </div>
</section>
