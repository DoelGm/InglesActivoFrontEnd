<section>
  <nav class="navbar custom-nav">
    <div class="container-fluid">

      <!-- Iconos a la izquierda -->
      <div class="d-flex align-items-center position-relative">

        <!-- Icono de perfil -->
        <a class="icon-hover text-white me-4 fs-1" (click)="openProfile()">
          <i class="bi bi-person-circle"></i>
        </a>

        <!-- Icono de notificación -->
        <a class="icon-hover text-white fs-3 position-relative"
           (click)="toggleNotifications()">
          <i class="bi bi-bell"></i>

          <!-- Contador de notificaciones -->
          <span *ngIf="notificationCount > 0" 
                class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
            {{ notificationCount }}
          </span>

          <!-- Contenido de la notificación (solo al click) -->
          <div class="toast-notification position-absolute"
               *ngIf="showNotifications"
               style="top: 30px; left: 50%; transform: translateX(-50%); z-index: 2000;">
            {{ lastNotification }}
          </div>
        </a>

      </div>

      <!-- Home y logo al lado derecho -->
      <div class="d-flex align-items-center ms-auto">
        <a class="nav-link-custom me-4" (click)="goHome()">
          <div class="d-inline-block text-white text-start">
            <p class="mb-0 fs-5">Home</p>
          </div>
        </a>

        <a class="navbar-brand" href="/home">
          <img src="assets/imgs/logo-blanco.png" alt="Logo" width="200" height="50" class="d-inline-block align-text-top">
        </a>
      </div>

    </div>
  </nav>
</section>

<!-- Ventana emergente del perfil -->
<div class="profile-overlay" *ngIf="showProfile" (click)="closeProfile()">
  <div class="profile-container" (click)="$event.stopPropagation()">
    <app-profile (close)="closeProfile()"></app-profile>
  </div>
</div>
