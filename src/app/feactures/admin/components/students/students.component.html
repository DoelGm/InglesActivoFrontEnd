<section>
  <div class="row">
    <div class="card shadow-sm mb-3 mt-4 bg-body-secondary rounded bg-opacity-50 text-dark p-3">
      <div class="card mb-4 shadow-sm p-3">
        <div class="card-header py-3" style="background: linear-gradient(135deg, #00BBFF 0%, #5fb3f7 100%);border-radius: 13px 13px 0 0 !important;">
          <h5 class="mb-0 text-white fw-bold d-flex justify-content-between align-items-center">
            <span><i class="bi bi-people-fill me-2"></i>Students Management</span>
          </h5>
        </div>
        
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-hover m-0">
              <thead class="table-light">
                <tr>
                  <th>Student</th>
                  <th>Course</th>
                  <th>Status</th>
                  <th class="text-end">Edit</th>
                  <th class="text-end">Delete</th>
                </tr>
              </thead>
              <tbody *ngIf="!loading && students.length > 0">
                <tr *ngFor="let student of students">
                  <td>
                    <div class="d-flex align-items-center">
                      <div
                        class="rounded-circle bg-info text-white d-flex align-items-center justify-content-center"
                        style="width: 36px; height: 36px; font-size: 0.9rem">
                        {{ getInitials(student.name) }}
                      </div>
                      <div class="ms-3">
                        <p class="fw-bold mb-0">{{ student.name }}</p>
                        <p class="text-muted mb-0 small">{{ student.email }}</p>
                      </div>
                    </div>
                  </td>

                  <td>{{ student.course }}</td>

                  <td>
                    <span
                      class="badge"
                      [ngClass]="{
                        'bg-success': student.status === 'ACTIVE',
                        'bg-warning': student.status === 'PENDING',
                        'bg-danger': student.status === 'INACTIVE'
                      }">
                      {{ student.status }}
                    </span>
                  </td>

                  <td class="text-end">
                    <button class="btn btn-sm btn-outline-primary">
                      <i class="bi bi-pencil"></i> Edit
                    </button>
                  </td>

                  <td class="text-end">
                    <button class="btn btn-sm btn-outline-danger">
                      <i class="bi bi-trash"></i> Delete
                    </button>
                  </td>
                </tr>
              </tbody>

              <tbody *ngIf="loading">
                <tr>
                  <td colspan="5" class="text-center py-4">
                    Cargando estudiantes...
                  </td>
                </tr>
              </tbody>

              <tbody *ngIf="!loading && students.length === 0">
                <tr>
                  <td colspan="5" class="text-center py-4 text-muted">
                    No hay estudiantes registrados
                  </td>
                </tr>
              </tbody>

            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
