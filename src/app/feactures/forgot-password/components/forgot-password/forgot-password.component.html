<section>
  <div class="row">
    <div class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">
      <div class="card shadow p-5 bg-custom rounded-4"
           style="width: 100%; max-width: 500px; border: 1px solid #049FFF;">

        <h4 class="text-center mb-2" style="color: #049FFF">
          Recuperar contraseña
        </h4>
        <span class="text-secondary small text-center d-block">
          Ingresa tu correo para recibir una contraseña temporal
        </span>

        <!-- ALERTA -->
        <div *ngIf="alertMessage"
             class="alert mt-3"
             [ngClass]="{
               'alert-success': alertType === 'success',
               'alert-danger': alertType === 'error'
             }">
          {{ alertMessage }}
        </div>

        <!-- FORMULARIO -->
        <form class="mt-4" (ngSubmit)="onSubmit()" *ngIf="!successSent">

          <!-- Email Input -->
          <div class="mb-3 floating-label-container">
            <div class="form-control position-relative p-0"
                 style="background: transparent; border: none;">

              <label for="email" class="floating-label">Email</label>

              <input
                type="email"
                class="floating-input w-100 rounded"
                id="email"
                name="email"
                [(ngModel)]="email"
                placeholder="nombre@ejemplo.com"
                required
                style="padding-left: 12px; padding-right: 12px;"
              />
            </div>
          </div>

          <!-- BOTÓN ENVIAR -->
            <button type="submit" class="btn btn-custom w-100 mb-3" [disabled]="isLoading">
                <span *ngIf="!isLoading">Enviar contraseña temporal</span>
                <span *ngIf="isLoading">
                <span class="spinner-border spinner-border-sm me-2"></span>
                Enviando...
                </span>
            </button>

            <!-- VOLVER AL LOGIN (si el usuario se equivoca) -->
            <button class="btn btn-outline-danger w-100" (click)="goLogin()">
                Volver al login
            </button>

            </form>

            <!-- ESTADO DE ÉXITO -->
            <div *ngIf="successSent" class="text-center mt-4">
            <i class="bi bi-check-circle-fill text-success fs-1"></i>
            <p class="mt-3 mb-3">
                Se envió una contraseña temporal a tu correo.
            </p>
            </div>
      </div>
    </div>
  </div>
</section>
