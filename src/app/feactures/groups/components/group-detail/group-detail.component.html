<section class="container mt-4">
  <h2 class="fw-semibold mb-4">Publicaciones del grupo</h2>

  <div *ngFor="let post of posts" class="card mb-4 shadow-sm border-0">
    <img
      src="assets/imgs/default.png"
      class="card-img-top"
      alt="Clase"
      style="height: 250px; object-fit: cover;"
    />

    <div class="card-body">
      <h5 class="card-title fw-semibold">{{ post.title }}</h5>
      <p class="card-text text-muted">{{ post.content }}</p>
    </div>
  </div>
</section>
